[package]
edition = "2021"
name = "aircraft-rs"
version = "0.0.0"

[lib]
crate-type = ["cdylib"]

[dependencies]
# Default enable napi4 feature, see https://nodejs.org/api/n-api.html#node-api-version-matrix
napi = { version = "3.12.0", default-features = false, features = ["napi4", "async", "serde-json"] }
napi-derive = "3.6.2"
flextrek = "0.3.2"
windows = { version = "0.62", features = ["Win32_UI_Input_KeyboardAndMouse"] }
share = { path = "../../share", features = ["napi-support"] }
summary = { path = "../../summary", features = ["napi-support"] }
pdf_parser = { path = "../../pdf_parser" , features = ["napi-support"] }
aircraft-types = { path = "../../types", features = ["napi-support"] }
[build-dependencies]
napi-build = "2.4.0"

[profile.release]
lto = true
strip = "symbols"
