[package]
name = "share"
version = "0.1.0"
edition = "2021"

[features]
default = []
napi-support = [
  "summary/napi-support",
  "pdf_parser/napi-support",
  "aircraft-types/napi-support",
]

[dependencies]
chrono = "0.4.45"
colored = "2.2.0"
regex = "1.13.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
lazy_static = "1.5.0"
native-dialog = "0.7.0"
reqwest = { version = "0.12.28", features = [
  "blocking",
  "json",
  "multipart",
  "cookies",
  "stream",
] }
copypasta = "0.10.2"
flextrek = "0.3.2"
clipkeeper = "0.1.1"
clipboard-rs = "0.3.5"
futures-util = "0.3.33"
bytes = "1.12.1"
clipboard-win = "5.4.1"
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }
summary = { path = "../summary" }
pdf_parser = { path = "../pdf_parser" }
aircraft-types = { path = "../types" }
urlencoding = "2.1.3"
base64 = "0.22"
known-folders = "1.4.2"
axum = {version= "0.8.9",features = ["multipart"]}
tower = "0.5.3"
tower-http = { version = "0.6.11", features= ["cors"]}
